services:
  tracker:
    build: .
    image: ai-ebay-deal-tracker
    container_name: deal-tracker
    restart: unless-stopped
    env_file: .env
    ports:
      # Bound to localhost. To reach the dashboard from another machine,
      # set WEB_TOKEN in .env and change this to "8000:8000".
      - "127.0.0.1:8000:8000"
    volumes:
      - tracker-data:/data
      - ./profiles.toml:/app/config/profiles.toml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  tracker-data:
